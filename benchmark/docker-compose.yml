x-backend: &backend
  build:
    context: ./backend
  cpuset: "${BACKEND_CPUSET:-1}"
  init: true
  restart: unless-stopped

x-proxy-limits: &proxy-limits
  cpuset: "${PROXY_CPUSET:-0}"
  deploy:
    resources:
      limits:
        memory: 512M
  ulimits:
    nofile: 65535
  restart: unless-stopped

services:
  nautrouds:
    <<: *proxy-limits
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - nautrouds-sockets:/var/run/nautrouds
      - ./nautrouds/Ntufile:/etc/nautrouds/Ntufile
    environment:
      - NAUTROUDS_CONFIG=/etc/nautrouds/Ntufile
      - NAUTROUDS_MAX_IDLE_CONNS_PER_NODE=1024
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/nautrouds/entrypoints/nautrouds-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - nautrouds-solo
      - nautrouds-proxy
      - caddy-tls
      - nginx-tls

  backend-nautrouds:
    <<: *backend
    command: ["-socket", "/var/run/nautrouds/services/backend-service/node-0.sock"]
    volumes:
      - nautrouds-sockets:/var/run/nautrouds
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/nautrouds/services/backend-service/node-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - baseline
      - nautrouds-proxy
      - caddy-tls
      - nginx-tls

  caddy:
    <<: *proxy-limits
    image: caddy:2-alpine
    volumes:
      - bench-sockets:/var/run/bench
      - nautrouds-sockets:/var/run/nautrouds
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./tls:/etc/caddy/tls:ro
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /var/run/bench/caddy && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    expose:
      - "8443"
      - "8444"
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/caddy/entry.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - caddy-solo
      - caddy-proxy
      - caddy-tls

  backend-caddy:
    <<: *backend
    command: ["-socket", "/var/run/bench/backends/caddy/backend-service/node-0.sock"]
    volumes:
      - bench-sockets:/var/run/bench
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/backends/caddy/backend-service/node-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - caddy-proxy

  nginx:
    <<: *proxy-limits
    image: nginx:1.27-alpine
    volumes:
      - bench-sockets:/var/run/bench
      - nautrouds-sockets:/var/run/nautrouds
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /var/run/bench/nginx && rm -f /var/run/bench/nginx/entry.sock && exec nginx -g 'daemon off; worker_processes ${PROXY_CPU_COUNT:-1};'"
    expose:
      - "8443"
      - "8444"
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/nginx/entry.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - nginx-solo
      - nginx-proxy
      - nginx-tls

  backend-nginx:
    <<: *backend
    command: ["-socket", "/var/run/bench/backends/nginx/backend-service/node-0.sock"]
    volumes:
      - bench-sockets:/var/run/bench
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/backends/nginx/backend-service/node-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - nginx-proxy

  client:
    build:
      context: ./client
    init: true
    volumes:
      - nautrouds-sockets:/var/run/nautrouds
      - bench-sockets:/var/run/bench
    cpuset: "${CLIENT_CPUSET:-2}"
    ulimits:
      nofile: 65535
    profiles:
      - baseline
      - nautrouds-solo
      - nautrouds-proxy
      - caddy-solo
      - caddy-proxy
      - nginx-solo
      - nginx-proxy
      - caddy-tls
      - nginx-tls

volumes:
  nautrouds-sockets:
  bench-sockets:
