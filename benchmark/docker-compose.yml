services:
  nautrouds:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - nautrouds-sockets:/var/run/nautrouds
      - ./nautrouds/Ntufile:/etc/nautrouds/Ntufile
    environment:
      - NAUTROUDS_CONFIG=/etc/nautrouds/Ntufile
    cpuset: "${SERVER_CPUSET:-0-5}"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/nautrouds/entrypoints/nautrouds-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    profiles:
      - nautrouds-solo
      - nautrouds-proxy
      - caddy-tls
      - nginx-tls

  backend-nautrouds:
    build:
      context: ..
      dockerfile: examples/backend/Dockerfile
    environment:
      - SERVICE_NAME=backend-service
    volumes:
      - nautrouds-sockets:/var/run/nautrouds
    cpuset: "${SERVER_CPUSET:-0-5}"
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/nautrouds/services/backend-service/node-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    profiles:
      - nautrouds-proxy
      - caddy-tls
      - nginx-tls

  caddy:
    image: caddy:2-alpine
    volumes:
      - bench-sockets:/var/run/bench
      - nautrouds-sockets:/var/run/nautrouds
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./tls:/etc/caddy/tls:ro
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /var/run/bench/caddy && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    expose:
      - "8443"
      - "8444"
    cpuset: "${SERVER_CPUSET:-0-5}"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/caddy/entry.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    profiles:
      - caddy-solo
      - caddy-proxy
      - caddy-tls

  backend-caddy:
    build:
      context: ..
      dockerfile: examples/backend/Dockerfile
    environment:
      - SERVICE_NAME=backend-service
      - NAUTROUDS_SERVICES_DIR=/var/run/bench/backends/caddy
    volumes:
      - bench-sockets:/var/run/bench
    cpuset: "${SERVER_CPUSET:-0-5}"
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/backends/caddy/backend-service/node-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    profiles:
      - caddy-proxy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - bench-sockets:/var/run/bench
      - nautrouds-sockets:/var/run/nautrouds
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /var/run/bench/nginx && rm -f /var/run/bench/nginx/entry.sock && exec nginx -g 'daemon off;'"
    expose:
      - "8443"
      - "8444"
    cpuset: "${SERVER_CPUSET:-0-5}"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/nginx/entry.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    profiles:
      - nginx-solo
      - nginx-proxy
      - nginx-tls

  backend-nginx:
    build:
      context: ..
      dockerfile: examples/backend/Dockerfile
    environment:
      - SERVICE_NAME=backend-service
      - NAUTROUDS_SERVICES_DIR=/var/run/bench/backends/nginx
    volumes:
      - bench-sockets:/var/run/bench
    cpuset: "${SERVER_CPUSET:-0-5}"
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/bench/backends/nginx/backend-service/node-0.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    profiles:
      - nginx-proxy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - nautrouds-sockets:/var/run/nautrouds
      - bench-sockets:/var/run/bench
    environment:
      - NAUTROUDS_SOCK=/var/run/nautrouds/entrypoints/nautrouds-0.sock
      - CADDY_SOCK=/var/run/bench/caddy/entry.sock
      - NGINX_SOCK=/var/run/bench/nginx/entry.sock
      - CADDY_TLS_NAUTROUDS_ADDR=caddy:8443
      - CADDY_TLS_DIRECT_ADDR=caddy:8444
      - NGINX_TLS_NAUTROUDS_ADDR=nginx:8443
      - NGINX_TLS_DIRECT_ADDR=nginx:8444
    cpuset: "${CLIENT_CPUSET:-6}"

volumes:
  nautrouds-sockets:
  bench-sockets:
