worker_rlimit_nofile 65535;
events { worker_connections 16384; }
http {
    access_log off;
    keepalive_requests 1000000;
    proxy_max_temp_file_size 0;
    proxy_request_buffering off;

    upstream backend {
        server unix:/var/run/bench/backends/nginx/backend-service/node-0.sock;
        keepalive 1024;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    upstream nautrouds {
        server unix:/var/run/nautrouds/entrypoints/nautrouds-0.sock;
        keepalive 1024;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    server {
        listen unix:/var/run/bench/nginx/entry.sock;

        location /builtin/health {
            return 200 "Hello from Nginx built-in";
        }

        location /proxy/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_session_cache   shared:SSL:10m;

        location / {
            proxy_pass http://nautrouds;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8444 ssl;
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_session_cache   shared:SSL:10m;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
