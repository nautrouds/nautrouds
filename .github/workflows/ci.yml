name: Nautrouds CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'

jobs:
  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Run Unit Tests
        run: go test -v ./internal/...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: go-tests
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Integration Tests
        run: go test -v -timeout 300s ./tests/... -run TestIntegration

  publish-ghcr:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [go-tests, integration-tests]
    if: >-
      github.repository == 'nautrouds/nautrouds' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image version
        id: version
        run: echo "value=$(date -u +'%y%m%d%H')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Get Previous Tag
        id: prev_tag
        run: echo "value=$(git tag --sort=-creatordate | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build Release Notes
        id: notes
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.value }}
          CUR_TAG: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_LINE="**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${CUR_TAG}"
          else
            CHANGELOG_LINE="**Full Changelog**: https://github.com/${REPO}/commits/${CUR_TAG}"
          fi

          {
            echo "body<<EOF"
            echo "## What's Changed"
            git log -1 --pretty=%B "$GITHUB_SHA"
            echo ""
            echo "$CHANGELOG_LINE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Nautrouds)
        id: meta-nautrouds
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and Push Nautrouds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-nautrouds.outputs.tags }}
          labels: ${{ steps.meta-nautrouds.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.notes.outputs.body }}
